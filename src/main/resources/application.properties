spring.application.name=Hadidy
springdoc.swagger-ui.path=/ahmed-ui.html
springdoc.api-docs.path=/my-api-docs

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:hadidy}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}

spring.jpa.show-sql=true

spring.jpa.hibernate.ddl-auto=update