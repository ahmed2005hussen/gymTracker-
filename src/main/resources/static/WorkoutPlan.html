<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout plan — Hadidy</title><link rel="stylesheet" href="style.css"><style>.day-link{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:inherit}.day-link h3{font-size:16px}.day-link p{font-size:12px;color:var(--muted);margin-top:5px}</style></head><body><nav class="navbar"><a href="Workouts.html" class="nav-logo"><div class="logo-icon">H</div><span class="logo-text">Ha<span>didy</span></span></a><div class="nav-right"><a href="Workouts.html" class="btn btn-ghost btn-sm">← All plans</a></div></nav><div class="app-layout"><aside class="sidebar"></aside><main class="main-content"><div class="page-header-row" style="margin-bottom:1.5rem"><div><a href="Workouts.html" class="text-action" style="margin:0">← Workout plans</a><h1 id="title" style="margin-top:10px">Loading…</h1><p id="description"></p></div><button class="btn btn-primary btn-sm" onclick="openModal()">+ Add day</button></div><div id="days" style="display:grid;gap:12px"></div></main></div><div class="modal-overlay" id="modal"><div class="modal"><div class="modal-header"><span class="modal-title">Add workout day</span><button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-group"><label>Day name</label><input id="name" placeholder="Push day" style="padding-left:12px"></div><div class="form-group"><label>Description</label><input id="descriptionInput" placeholder="Chest and triceps" style="padding-left:12px"></div><div class="form-group"><label>Expected minutes</label><input id="time" type="number" placeholder="60" style="padding-left:12px"></div><button class="btn btn-primary" onclick="addDay()">Add day</button></div></div><script src="api.js"></script><script>const planId=new URLSearchParams(location.search).get('id'),el=id=>document.getElementById(id);if(!planId)location.href='Workouts.html';function openModal(){el('modal').classList.add('open')}function closeModal(){el('modal').classList.remove('open')}async function addDay(){if(!el('name').value.trim())return;try{await api(`/api/workout-plans/${planId}/days`,{method:'POST',body:JSON.stringify({name:el('name').value.trim(),description:el('descriptionInput').value.trim()||null,expectedTime:Number(el('time').value)||0,totalExercises:0,totalRepeat:0})});closeModal();load()}catch(e){showApiError(e)}}async function load(){requireAuth();const [plan,days]=await Promise.all([api(`/api/workout-plan/${planId}`),api(`/api/workout-plans/${planId}/days`)]);el('title').textContent=plan.name;el('description').textContent=plan.description||'Add days, then open each day to manage exercises.';el('days').innerHTML=days.length?days.map(d=>`<a class="card day-link" href="WorkoutDay.html?planId=${planId}&dayId=${d.id}"><div><h3>◈ ${d.name}</h3><p>${d.description||'No description'}${d.expectedTime?' · '+d.expectedTime+' min':''}</p></div><span class="text-action" style="margin:0">Exercises →</span></a>`).join(''):'<div class="empty"><div class="empty-icon">◈</div><h3>No workout days yet</h3><p>Add your first day to this plan.</p></div>'}load().catch(showApiError)</script></body></html>
