<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meal — Hadidy</title><link rel="stylesheet" href="style.css"><style>.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.macro-grid div{background:var(--card2);border:1px solid var(--border);padding:16px;border-radius:12px}.macro-grid span{display:block;font-size:11px;color:var(--muted)}.macro-grid strong{font-size:23px;margin-top:7px;display:block}@media(max-width:600px){.macro-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><nav class="navbar"><a href="Diet.html" class="nav-logo"><div class="logo-icon">H</div><span class="logo-text">Ha<span>didy</span></span></a><div class="nav-right"><a id="back" class="btn btn-ghost btn-sm">← Meals</a></div></nav><div class="app-layout"><aside class="sidebar"></aside><main class="main-content"><a id="crumb" class="text-action" style="margin:0">← Diet plan</a><h1 id="title" style="margin:14px 0 6px">Loading…</h1><p id="recipe" style="color:var(--muted);max-width:650px;line-height:1.7"></p><section class="macro-grid"><div><span>CALORIES</span><strong id="calories">0</strong></div><div><span>PROTEIN</span><strong id="protein">0g</strong></div><div><span>CARBS</span><strong id="carbs">0g</strong></div><div><span>FATS</span><strong id="fats">0g</strong></div></section><p id="time" style="color:var(--muted)"></p></main></div><script src="api.js"></script><script>const q=new URLSearchParams(location.search),dietId=q.get('dietId'),mealId=q.get('mealId'),el=id=>document.getElementById(id);if(!dietId||!mealId)location.href='Diet.html';el('back').href=el('crumb').href=`DietPlan.html?id=${dietId}`;async function load(){requireAuth();const m=await api(`/api/diet-plans/${dietId}/meals/${mealId}`);el('title').textContent=m.name;el('recipe').textContent=m.recipe||'No recipe was added for this meal.';el('calories').textContent=(m.calories||0)+' kcal';el('protein').textContent=(m.protein||0)+'g';el('carbs').textContent=(m.carbs||0)+'g';el('fats').textContent=(m.fats||0)+'g';el('time').textContent=m.time?'Suggested time: '+m.time:''}load().catch(showApiError)</script></body></html>
