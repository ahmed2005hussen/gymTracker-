<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diet plan — Hadidy</title><link rel="stylesheet" href="style.css"><style>.meal-link{display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:inherit}.meal-link h3{font-size:16px}.meal-link p{font-size:12px;color:var(--muted);margin-top:5px}</style></head><body><nav class="navbar"><a href="Diet.html" class="nav-logo"><div class="logo-icon">H</div><span class="logo-text">Ha<span>didy</span></span></a><div class="nav-right"><a href="Diet.html" class="btn btn-ghost btn-sm">← All diet plans</a></div></nav><div class="app-layout"><aside class="sidebar"></aside><main class="main-content"><div class="page-header-row" style="margin-bottom:1.5rem"><div><a href="Diet.html" class="text-action" style="margin:0">← Diet plans</a><h1 id="title" style="margin-top:10px">Loading…</h1><p id="description"></p></div><button class="btn btn-primary btn-sm" onclick="openModal()">+ Add meal</button></div><div id="meals" style="display:grid;gap:12px"></div></main></div><div class="modal-overlay" id="modal"><div class="modal"><div class="modal-header"><span class="modal-title">Add meal</span><button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-group"><label>Meal name</label><input id="name" placeholder="Chicken and rice" style="padding-left:12px"></div><div class="form-group"><label>Recipe</label><textarea id="recipe" placeholder="How to prepare it"></textarea></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="form-group"><label>Calories</label><input id="calories" type="number" style="padding-left:12px"></div><div class="form-group"><label>Protein (g)</label><input id="protein" type="number" style="padding-left:12px"></div><div class="form-group"><label>Carbs (g)</label><input id="carbs" type="number" style="padding-left:12px"></div><div class="form-group"><label>Fats (g)</label><input id="fats" type="number" style="padding-left:12px"></div></div><button class="btn btn-primary" onclick="addMeal()">Add meal</button></div></div><script src="api.js"></script><script>const dietId=new URLSearchParams(location.search).get('id'),el=id=>document.getElementById(id);if(!dietId)location.href='Diet.html';function openModal(){el('modal').classList.add('open')}function closeModal(){el('modal').classList.remove('open')}async function addMeal(){if(!el('name').value.trim())return;const n=id=>Number(el(id).value)||0;try{await api(`/api/diet-plans/${dietId}/meals`,{method:'POST',body:JSON.stringify({name:el('name').value.trim(),recipe:el('recipe').value.trim()||null,calories:n('calories'),protein:n('protein'),carbs:n('carbs'),fats:n('fats')})});closeModal();load()}catch(e){showApiError(e)}}async function load(){requireAuth();const [plan,meals]=await Promise.all([api(`/api/diet-plans/${dietId}`),api(`/api/diet-plans/${dietId}/meals`)]);el('title').textContent=plan.title;el('description').textContent=plan.description||'Open a meal to see its complete details.';el('meals').innerHTML=meals.length?meals.map(m=>`<a class="card meal-link" href="Meal.html?dietId=${dietId}&mealId=${m.id}"><div><h3>🥗 ${m.name}</h3><p>${m.calories||0} kcal · P ${m.protein||0}g · C ${m.carbs||0}g · F ${m.fats||0}g</p></div><span class="text-action" style="margin:0">Details →</span></a>`).join(''):'<div class="empty"><div class="empty-icon">🥗</div><h3>No meals yet</h3><p>Add a meal to this diet plan.</p></div>'}load().catch(showApiError)</script></body></html>
