<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workouts — Hadidy</title><link rel="stylesheet" href="style.css"><style>.plan-tile{cursor:pointer;text-decoration:none;color:inherit;min-height:190px;display:flex;flex-direction:column;justify-content:space-between}.plan-tile h2{font-size:20px}.plan-tile p{color:var(--muted);font-size:13px;line-height:1.6}.plan-arrow{color:var(--accent);font-size:13px;font-weight:600}</style></head><body>
<nav class="navbar"><a href="Dashboard.html" class="nav-logo"><div class="logo-icon">H</div><span class="logo-text">Ha<span>didy</span></span></a><ul class="nav-links"><li><a href="Dashboard.html">Dashboard</a></li><li><a class="active" href="Workouts.html">Workouts</a></li><li><a href="Diet.html">Diet</a></li><li><a href="Supplements.html">Supplements</a></li></ul><div class="nav-right"><a href="Profile.html" class="nav-avatar" id="avatar">A</a></div></nav>
<div class="app-layout"><aside class="sidebar"></aside><main class="main-content"><div class="page-header-row" style="margin-bottom:1.5rem"><div><h1>Workout plans</h1><p>Choose a plan to see its workout days.</p></div><button class="btn btn-primary btn-sm" onclick="openModal()">+ New plan</button></div><div class="grid-3" id="plans"></div></main></div>
<div class="modal-overlay" id="modal"><div class="modal"><div class="modal-header"><span class="modal-title">New workout plan</span><button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-group"><label>Plan name</label><input id="name" placeholder="Push Pull Legs" style="padding-left:12px"></div><div class="form-group"><label>Description</label><textarea id="description" placeholder="Describe your plan"></textarea></div><button class="btn btn-primary" onclick="createPlan()">Create plan</button></div></div>
<script src="api.js"></script><script>let plans=[];const el=id=>document.getElementById(id);function openModal(){el('modal').classList.add('open')}function closeModal(){el('modal').classList.remove('open')}async function createPlan(){if(!el('name').value.trim())return;try{await api('/api/workout-plan',{method:'POST',body:JSON.stringify({name:el('name').value.trim(),description:el('description').value.trim()||null})});el('name').value=el('description').value='';closeModal();load()}catch(e){showApiError(e)}}function render(){el('plans').innerHTML=plans.length?plans.map(p=>`<a class="card plan-tile" href="WorkoutPlan.html?id=${p.id}"><div><span class="badge badge-accent">WORKOUT PLAN</span><h2 style="margin:14px 0 8px">${p.name}</h2><p>${p.description||'Open this plan to add workout days and exercises.'}</p></div><span class="plan-arrow">Open plan →</span></a>`).join(''):'<div class="empty" style="grid-column:1/-1"><div class="empty-icon">🏋️</div><h3>No workout plans yet</h3><p>Create a plan to start building your routine.</p><button class="btn btn-primary" onclick="openModal()">Create plan</button></div>'}async function load(){requireAuth();plans=await api('/api/workout-plan');el('avatar').textContent=(currentUsername()||'A')[0].toUpperCase();render()}load().catch(showApiError)</script></body></html>
