<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community — Hadidy</title><link rel="stylesheet" href="style.css"><style>.post{margin-bottom:16px}.post-head{display:flex;gap:10px;align-items:center;margin-bottom:12px}.post-head small{display:block;color:var(--muted);margin-top:2px}.post-text{font-size:14px;line-height:1.6;color:var(--text)}.post-actions{margin-top:14px;padding-top:10px;border-top:.5px solid var(--border);color:var(--muted);font-size:13px}</style></head><body>
<nav class="navbar"><a href="index.html" class="nav-logo"><div class="logo-icon">H</div><span class="logo-text">Ha<span>didy</span></span></a><ul class="nav-links"><li><a href="Dashboard.html">Dashboard</a></li><li><a href="Workouts.html">Workouts</a></li><li><a href="Diet.html">Diet</a></li><li><a href="Progress.html">Progress</a></li><li><a class="active" href="Community.html">Community</a></li></ul><div class="nav-right"><a href="Profile.html" class="nav-avatar" id="avatar">A</a></div></nav>
<div class="app-layout"><aside class="sidebar"><div class="sidebar-section"><div class="sidebar-label">Main</div><a href="Dashboard.html" class="sidebar-link"><span class="icon">🏠</span>Dashboard</a><a href="Workouts.html" class="sidebar-link"><span class="icon">🏋️</span>Workouts</a><a href="Diet.html" class="sidebar-link"><span class="icon">🥗</span>Diet</a><a href="Progress.html" class="sidebar-link"><span class="icon">📈</span>Progress</a><a href="Supplements.html" class="sidebar-link"><span class="icon">💊</span>Supplements</a></div><div class="sidebar-section"><div class="sidebar-label">Social</div><a href="Community.html" class="sidebar-link active"><span class="icon">👥</span>Community</a></div><div class="sidebar-section"><div class="sidebar-label">Account</div><a href="Profile.html" class="sidebar-link"><span class="icon">👤</span>Profile</a><a href="Login.html" class="sidebar-link"><span class="icon">🚪</span>Log out</a></div></aside><main class="main-content"><div class="page-header"><h1>Community</h1><p>Share your wins and find motivation from your crew.</p></div><div class="card" style="margin-bottom:16px"><div class="form-group"><label>Share an update</label><textarea id="message" placeholder="Finished a workout? Hit a new personal best?"></textarea></div><button class="btn btn-primary" onclick="publish()">Publish post</button></div><div id="feed"></div></main></div>
<script>const u=JSON.parse(localStorage.getItem('hadidy_user')||'{}');let posts=JSON.parse(localStorage.getItem('hadidy_posts')||'[]');avatar.textContent=(u.username||'A')[0].toUpperCase();function publish(){const text=message.value.trim();if(!text)return;posts.unshift({author:u.username||'You',text,date:'Just now'});localStorage.setItem('hadidy_posts',JSON.stringify(posts));message.value='';render()}function render(){feed.innerHTML=posts.length?posts.map(p=>`<article class="card post"><div class="post-head"><div class="avatar avatar-sm">${p.author[0].toUpperCase()}</div><div><strong style="font-size:14px">${p.author}</strong><small>${p.date}</small></div></div><p class="post-text">${p.text}</p><div class="post-actions">♡ Encourage&nbsp;&nbsp;&nbsp; 💬 Comment</div></article>`).join(''):'<div class="empty"><div class="empty-icon">👥</div><h3>The feed is waiting for you</h3><p>Share your first update with the Hadidy community.</p></div>'}render()</script></body></html>
