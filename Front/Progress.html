<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress — Hadidy</title><link rel="stylesheet" href="style.css">
  <style>.log { display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:.5px solid var(--border); }.log:last-child{border:0}.log-date{font-size:12px;color:var(--muted)}.empty-log{text-align:center;color:var(--muted);padding:2rem;font-size:13px}</style>
</head>
<body>
<nav class="navbar"><a href="index.html" class="nav-logo"><div class="logo-icon">H</div><span class="logo-text">Ha<span>didy</span></span></a><ul class="nav-links"><li><a href="Dashboard.html">Dashboard</a></li><li><a href="Workouts.html">Workouts</a></li><li><a href="Diet.html">Diet</a></li><li><a class="active" href="Progress.html">Progress</a></li><li><a href="Community.html">Community</a></li></ul><div class="nav-right"><a href="Profile.html" class="nav-avatar" id="avatar">A</a></div></nav>
<div class="app-layout"><aside class="sidebar"><div class="sidebar-section"><div class="sidebar-label">Main</div><a href="Dashboard.html" class="sidebar-link"><span class="icon">🏠</span>Dashboard</a><a href="Workouts.html" class="sidebar-link"><span class="icon">🏋️</span>Workouts</a><a href="Diet.html" class="sidebar-link"><span class="icon">🥗</span>Diet</a><a href="Progress.html" class="sidebar-link active"><span class="icon">📈</span>Progress</a><a href="Supplements.html" class="sidebar-link"><span class="icon">💊</span>Supplements</a></div><div class="sidebar-section"><div class="sidebar-label">Social</div><a href="Community.html" class="sidebar-link"><span class="icon">👥</span>Community</a></div><div class="sidebar-section"><div class="sidebar-label">Account</div><a href="Profile.html" class="sidebar-link"><span class="icon">👤</span>Profile</a><a href="Login.html" class="sidebar-link"><span class="icon">🚪</span>Log out</a></div></aside>
<main class="main-content"><div class="page-header-row" style="margin-bottom:1.5rem"><div><h1>Progress</h1><p>Keep a clear record of every milestone.</p></div><button class="btn btn-primary btn-sm" onclick="toggleForm()">+ Log progress</button></div><div class="card" id="form" hidden style="margin-bottom:16px"><div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="form-group"><label>Weight (kg)</label><input id="weight" type="number" step="0.1" placeholder="75.5" style="padding-left:12px"></div><div class="form-group"><label>Note</label><input id="note" placeholder="How did training feel?" style="padding-left:12px"></div></div><button class="btn btn-primary" onclick="addLog()">Save entry</button></div><div class="grid-3" style="margin-bottom:16px"><div class="stat-card"><div class="stat-icon">⚖️</div><div class="stat-label">Latest weight</div><div class="stat-value" id="latest">—</div></div><div class="stat-card"><div class="stat-icon">🗓️</div><div class="stat-label">Entries</div><div class="stat-value" id="count">0</div></div><div class="stat-card"><div class="stat-icon">🎯</div><div class="stat-label">Goal</div><div class="stat-value" id="goal">—</div></div></div><div class="card"><h3 style="font-size:16px;margin-bottom:8px">Progress history</h3><div id="logs"></div></div></main></div>
<script>const user=JSON.parse(localStorage.getItem('hadidy_user')||'{}');let logs=JSON.parse(localStorage.getItem('hadidy_progress')||'[]');document.getElementById('avatar').textContent=(user.username||'A')[0].toUpperCase();document.getElementById('goal').textContent=user.goal||'—';function toggleForm(){form.hidden=!form.hidden}function addLog(){const weight=document.getElementById('weight').value;if(!weight)return;logs.unshift({weight,note:document.getElementById('note').value,date:new Date().toLocaleDateString()});localStorage.setItem('hadidy_progress',JSON.stringify(logs));form.hidden=true;weight.value='';note.value='';render()}function render(){latest.textContent=logs[0]?logs[0].weight+' kg':'—';count.textContent=logs.length;document.getElementById('logs').innerHTML=logs.length?logs.map(x=>`<div class="log"><div><strong>${x.weight} kg</strong><div style="font-size:13px;color:var(--muted);margin-top:3px">${x.note||'Progress entry'}</div></div><span class="log-date">${x.date}</span></div>`).join(''):'<div class="empty-log">Your progress entries will appear here.</div>'}render()</script>
</body></html>
