<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplements — Hadidy</title><link rel="stylesheet" href="style.css"><style>.supp-card{display:flex;gap:14px;align-items:center}.supp-icon{width:46px;height:46px;display:grid;place-items:center;background:var(--accent-dim);border-radius:10px;font-size:22px}.supp-info{flex:1}.supp-info p{color:var(--muted);font-size:12px;margin-top:3px}</style></head><body>
<nav class="navbar"><a href="index.html" class="nav-logo"><div class="logo-icon">H</div><span class="logo-text">Ha<span>didy</span></span></a><ul class="nav-links"><li><a href="Dashboard.html">Dashboard</a></li><li><a href="Workouts.html">Workouts</a></li><li><a href="Diet.html">Diet</a></li><li><a href="Progress.html">Progress</a></li><li><a href="Community.html">Community</a></li></ul><div class="nav-right"><a href="Profile.html" class="nav-avatar" id="avatar">A</a></div></nav>
<div class="app-layout"><aside class="sidebar"><div class="sidebar-section"><div class="sidebar-label">Main</div><a href="Dashboard.html" class="sidebar-link"><span class="icon">🏠</span>Dashboard</a><a href="Workouts.html" class="sidebar-link"><span class="icon">🏋️</span>Workouts</a><a href="Diet.html" class="sidebar-link"><span class="icon">🥗</span>Diet</a><a href="Progress.html" class="sidebar-link"><span class="icon">📈</span>Progress</a><a href="Supplements.html" class="sidebar-link active"><span class="icon">💊</span>Supplements</a></div><div class="sidebar-section"><div class="sidebar-label">Social</div><a href="Community.html" class="sidebar-link"><span class="icon">👥</span>Community</a></div><div class="sidebar-section"><div class="sidebar-label">Account</div><a href="Profile.html" class="sidebar-link"><span class="icon">👤</span>Profile</a><a href="Login.html" class="sidebar-link"><span class="icon">🚪</span>Log out</a></div></aside><main class="main-content"><div class="page-header-row" style="margin-bottom:1.5rem"><div><h1>Supplements</h1><p>Keep your supplement routine in one place.</p></div><button class="btn btn-primary btn-sm" onclick="toggleForm()">+ Add supplement</button></div><div class="card" id="form" hidden style="margin-bottom:16px"><div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="form-group"><label>Name</label><input id="name" placeholder="Creatine monohydrate" style="padding-left:12px"></div><div class="form-group"><label>Schedule</label><input id="schedule" placeholder="5g daily" style="padding-left:12px"></div></div><button class="btn btn-primary" onclick="add()">Save supplement</button></div><div class="grid-2" id="list"></div></main></div><script>const u=JSON.parse(localStorage.getItem('hadidy_user')||'{}');let items=JSON.parse(localStorage.getItem('hadidy_supplements')||'[]');avatar.textContent=(u.username||'A')[0].toUpperCase();function toggleForm(){form.hidden=!form.hidden}function add(){if(!name.value.trim())return;items.unshift({name:name.value,schedule:schedule.value});localStorage.setItem('hadidy_supplements',JSON.stringify(items));name.value='';schedule.value='';form.hidden=true;render()}function remove(i){items.splice(i,1);localStorage.setItem('hadidy_supplements',JSON.stringify(items));render()}function render(){list.innerHTML=items.length?items.map((x,i)=>`<div class="card supp-card"><div class="supp-icon">💊</div><div class="supp-info"><strong>${x.name}</strong><p>${x.schedule||'No schedule set'}</p></div><button class="btn btn-danger btn-sm" onclick="remove(${i})">Delete</button></div>`).join(''):'<div class="empty" style="grid-column:1/-1"><div class="empty-icon">💊</div><h3>No supplements yet</h3><p>Add the products you use to track your routine.</p></div>'}render()</script></body></html>
