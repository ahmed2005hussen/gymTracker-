<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplements — Hadidy</title><link rel="stylesheet" href="style.css"><style>.supp-card{display:flex;gap:14px;align-items:center}.supp-icon{width:46px;height:46px;display:grid;place-items:center;background:var(--accent-dim);border-radius:10px;font-size:22px}.supp-info{flex:1}.supp-info p{color:var(--muted);font-size:12px;margin-top:3px}</style></head><body>
<nav class="navbar"><a href="index.html" class="nav-logo"><div class="logo-icon">H</div><span class="logo-text">Ha<span>didy</span></span></a><ul class="nav-links"><li><a href="Dashboard.html">Dashboard</a></li><li><a href="Workouts.html">Workouts</a></li><li><a href="Diet.html">Diet</a></li><li><a href="Progress.html">Progress</a></li></ul><div class="nav-right"><a href="Profile.html" class="nav-avatar" id="avatar">A</a></div></nav>
<div class="app-layout"><aside class="sidebar"></aside><main class="main-content"><div class="page-header-row" style="margin-bottom:1.5rem"><div><h1>Supplements</h1><p>Keep your supplement routine in one place.</p></div><button class="btn btn-primary btn-sm" onclick="toggleForm()">+ Add supplement</button></div><div class="card" id="form" hidden style="margin-bottom:16px"><div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="form-group"><label>Name *</label><input id="name" required placeholder="Creatine monohydrate" style="padding-left:12px"></div><div class="form-group"><label>Price *</label><input id="price" required type="number" min="0" step=".01" placeholder="250" style="padding-left:12px"></div></div><div class="form-group"><label>Description</label><input id="description" placeholder="5g daily" style="padding-left:12px"></div><div class="form-group"><label>Image path</label><input id="picture" placeholder="images/supplement.jpg" style="padding-left:12px"></div><p id="formError" style="color:var(--danger);font-size:13px;margin:-4px 0 12px" hidden></p><button class="btn btn-primary" onclick="add()">Save supplement</button></div><div class="grid-2" id="list"></div></main></div>
<script src="api.js"></script><script>let items=[];const el=id=>document.getElementById(id);function toggleForm(){el('form').hidden=!el('form').hidden}async function add(){const name=el('name').value.trim(),price=el('price').value,error=el('formError');error.hidden=true;if(!name||price===''){error.textContent='Name and price are required.';error.hidden=false;return}try{await api('/api/supplements',{method:'POST',body:JSON.stringify({name,description:el('description').value.trim()||null,price:Number(price),picture:el('picture').value.trim()||null})});['name','price','description','picture'].forEach(id=>el(id).value='');el('form').hidden=true;await load()}catch(e){error.textContent=e.message;error.hidden=false}}async function remove(id){if(!confirm('Delete this supplement?'))return;try{await api('/api/supplements/'+id,{method:'DELETE'});await load()}catch(e){showApiError(e)}}function render(){el('list').innerHTML=items.length?items.map(x=>`<div class="card supp-card"><div class="supp-icon">${x.picture?`<img src="${x.picture}" alt="" style="width:46px;height:46px;object-fit:cover;border-radius:10px">`:'💊'}</div><div class="supp-info"><strong>${x.name}</strong><p>${x.description||'No description'}${x.price!=null?' · '+x.price+' EGP':''}</p></div><button class="btn btn-danger btn-sm" onclick="remove(${x.id})">Delete</button></div>`).join(''):'<div class="empty" style="grid-column:1/-1"><div class="empty-icon">💊</div><h3>No supplements yet</h3><p>Add the products you use to track your routine.</p></div>'}async function load(){requireAuth();items=await api('/api/supplements');el('avatar').textContent=(currentUsername()||'A')[0].toUpperCase();render()}load().catch(showApiError)</script></body></html>
