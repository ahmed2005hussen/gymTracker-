<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exercises — Hadidy</title><link rel="stylesheet" href="style.css"><style>.exercise{display:flex;justify-content:space-between;align-items:center}.exercise h3{font-size:16px}.exercise p{font-size:12px;color:var(--muted);margin-top:5px}</style></head><body><nav class="navbar"><a href="Workouts.html" class="nav-logo"><div class="logo-icon">H</div><span class="logo-text">Ha<span>didy</span></span></a><div class="nav-right"><a id="back" class="btn btn-ghost btn-sm">← Workout days</a></div></nav><div class="app-layout"><aside class="sidebar"></aside><main class="main-content"><div class="page-header-row" style="margin-bottom:1.5rem"><div><a id="crumb" class="text-action" style="margin:0">← Workout plan</a><h1 id="title" style="margin-top:10px">Loading…</h1><p id="description"></p></div><button class="btn btn-primary btn-sm" onclick="openModal()">+ Add exercise</button></div><div id="exercises" style="display:grid;gap:12px"></div></main></div><div class="modal-overlay" id="modal"><div class="modal"><div class="modal-header"><span class="modal-title">Add exercise</span><button class="modal-close" onclick="closeModal()">✕</button></div><div class="form-group"><label>Exercise name</label><input id="name" placeholder="Bench press" style="padding-left:12px"></div><div class="form-group"><label>Description</label><input id="descriptionInput" placeholder="Barbell bench press" style="padding-left:12px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="form-group"><label>Sets</label><input id="sets" type="number" placeholder="3" style="padding-left:12px"></div><div class="form-group"><label>Reps</label><input id="repeat" type="number" placeholder="10" style="padding-left:12px"></div></div><button class="btn btn-primary" onclick="addExercise()">Add exercise</button></div></div><script src="api.js"></script><script>const q=new URLSearchParams(location.search),planId=q.get('planId'),dayId=q.get('dayId'),el=id=>document.getElementById(id);if(!planId||!dayId)location.href='Workouts.html';el('back').href=el('crumb').href=`WorkoutPlan.html?id=${planId}`;function openModal(){el('modal').classList.add('open')}function closeModal(){el('modal').classList.remove('open')}async function addExercise(){if(!el('name').value.trim())return;try{await api(`/api/workout-plans/${planId}/days/${dayId}/exercises`,{method:'POST',body:JSON.stringify({name:el('name').value.trim(),description:el('descriptionInput').value.trim()||null,sets:Number(el('sets').value)||0,repeat:Number(el('repeat').value)||0})});closeModal();load()}catch(e){showApiError(e)}}async function load(){requireAuth();const [day,exercises]=await Promise.all([api(`/api/workout-plans/${planId}/days/${dayId}`),api(`/api/workout-plans/${planId}/days/${dayId}/exercises`)]);el('title').textContent=day.name;el('description').textContent=day.description||'All exercises for this workout day.';el('exercises').innerHTML=exercises.length?exercises.map(x=>`<article class="card exercise"><div><h3>💪 ${x.name}</h3><p>${x.sets||0} sets × ${x.repeat||0} reps${x.description?' · '+x.description:''}</p></div></article>`).join(''):'<div class="empty"><div class="empty-icon">💪</div><h3>No exercises yet</h3><p>Add an exercise to this workout day.</p></div>'}load().catch(showApiError)</script></body></html>
