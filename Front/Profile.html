<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — Hadidy</title><link rel="stylesheet" href="style.css"><style>.profile-top{display:flex;align-items:center;gap:16px;margin-bottom:24px}.profile-top h1{font-size:24px}.profile-top p{color:var(--muted);font-size:13px;margin-top:4px}.profile-avatar{width:68px;height:68px;font-size:24px}.settings{max-width:620px}</style></head><body>
<nav class="navbar"><a href="index.html" class="nav-logo"><div class="logo-icon">H</div><span class="logo-text">Ha<span>didy</span></span></a><ul class="nav-links"><li><a href="Dashboard.html">Dashboard</a></li><li><a href="Workouts.html">Workouts</a></li><li><a href="Diet.html">Diet</a></li><li><a href="Progress.html">Progress</a></li><li><a href="Community.html">Community</a></li></ul><div class="nav-right"><a href="Profile.html" class="nav-avatar active" id="avatar">A</a></div></nav>
<div class="app-layout"><aside class="sidebar"><div class="sidebar-section"><div class="sidebar-label">Main</div><a href="Dashboard.html" class="sidebar-link"><span class="icon">🏠</span>Dashboard</a><a href="Workouts.html" class="sidebar-link"><span class="icon">🏋️</span>Workouts</a><a href="Diet.html" class="sidebar-link"><span class="icon">🥗</span>Diet</a><a href="Progress.html" class="sidebar-link"><span class="icon">📈</span>Progress</a><a href="Supplements.html" class="sidebar-link"><span class="icon">💊</span>Supplements</a></div><div class="sidebar-section"><div class="sidebar-label">Social</div><a href="Community.html" class="sidebar-link"><span class="icon">👥</span>Community</a></div><div class="sidebar-section"><div class="sidebar-label">Account</div><a href="Profile.html" class="sidebar-link active"><span class="icon">👤</span>Profile</a><a href="Login.html" class="sidebar-link" onclick="localStorage.removeItem('hadidy_logged_in')"><span class="icon">🚪</span>Log out</a></div></aside><main class="main-content"><div class="profile-top"><div class="avatar profile-avatar" id="bigAvatar">A</div><div><h1 id="displayName">Your profile</h1><p>Manage the details that power your dashboard.</p></div></div><section class="card settings"><h2 style="font-size:17px;margin-bottom:18px">Personal details</h2><div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="form-group"><label>Username</label><input id="username" style="padding-left:12px"></div><div class="form-group"><label>Email</label><input id="email" type="email" style="padding-left:12px"></div><div class="form-group"><label>Weight (kg)</label><input id="weight" type="number" step=".1" style="padding-left:12px"></div><div class="form-group"><label>Height (cm)</label><input id="height" type="number" style="padding-left:12px"></div></div><div class="form-group"><label>Fitness goal</label><select id="goal"><option>Build muscle</option><option>Lose weight</option><option>Get fit</option></select></div><button class="btn btn-primary" onclick="save()">Save changes</button><span id="saved" style="margin-left:10px;color:var(--success);font-size:13px" hidden>Saved!</span></section></main></div>
<script>let u=JSON.parse(localStorage.getItem('hadidy_user')||'{}');function populate(){username.value=u.username||'';email.value=u.email||'';weight.value=u.weight||'';height.value=u.height||'';goal.value=u.goal||'Build muscle';const letter=(u.username||'A')[0].toUpperCase();avatar.textContent=bigAvatar.textContent=letter;displayName.textContent=u.username||'Your profile'}function save(){u={...u,username:username.value.trim(),email:email.value.trim(),weight:weight.value,height:height.value,goal:goal.value};localStorage.setItem('hadidy_user',JSON.stringify(u));saved.hidden=false;populate();setTimeout(()=>saved.hidden=true,2000)}populate()</script></body></html>
