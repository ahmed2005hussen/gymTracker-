<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Hadidy</title>
<link rel="stylesheet" href="style.css">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
  background: radial-gradient(ellipse at 50% 0%, rgba(200,169,110,0.06) 0%, transparent 60%); }
.login-box { width: 420px; }
.login-logo { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 2.5rem; text-decoration: none; }
.login-box h1 { font-size: 24px; font-weight: 500; text-align: center; margin-bottom: 6px; }
.login-box .sub { font-size: 14px; color: var(--muted); text-align: center; margin-bottom: 2rem; }
.login-box .sub a { color: var(--accent); text-decoration: none; }
input { padding-left: 12px !important; }
.forgot { font-size: 12px; color: var(--accent); text-decoration: none; float: right; margin-top: -8px; }
</style>
</head>
<body>

<div class="login-box">
  <a href="index.html" class="login-logo">
    <div class="logo-icon">H</div>
    <span class="logo-text">Ha<span>didy</span></span>
  </a>
  <h1>Welcome back</h1>
  <p class="sub">Don't have an account? <a href="Register.html">Sign up free</a></p>

  <div class="card">
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="ahmed123" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
        <a href="#" class="forgot">Forgot password?</a>
      </div>
      <br>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>
  </div>

  <div id="error" style="color:var(--danger); font-size:13px; text-align:center; margin-top:1rem; display:none;">
    Invalid username or password.
  </div>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();
  localStorage.setItem('hadidy_logged_in', 'true');
  const user = { username: document.getElementById('username').value, goal: 'Build muscle', weight: 80, height: 175 };
  if (!localStorage.getItem('hadidy_user')) localStorage.setItem('hadidy_user', JSON.stringify(user));
  window.location.href = 'Dashboard.html';
}
</script>
</body>
</html>
